name: Build Side-by-Side Baseline Verification APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/APK_SIDE_BY_SIDE_VERIFY_TRIGGER.md'

permissions:
  contents: read

env:
  NODE_ENV: production
  CI: 'true'

jobs:
  build-apk:
    name: Build standalone side-by-side V3.6.0 verification APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact frozen baseline
        uses: actions/checkout@v5
        with:
          ref: b907d7aeced266e914c360c2f70b475dd9e42b62
          fetch-depth: 1

      - name: Verify exact baseline source
        run: |
          test "$(git rev-parse HEAD)" = "b907d7aeced266e914c360c2f70b475dd9e42b62"
          git rev-parse HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run exact V3.6.0 acceptance preflight before any identity patch
        run: npm run preflight:acceptance

      - name: Apply temporary side-by-side Android identity patch in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          old = "applicationId 'com.etfpilot.twselive'"
          new = "applicationId 'com.etfpilot.twselive.baselineverify'"
          assert text.count(old) == 1, f'unexpected applicationId count: {text.count(old)}'
          gradle.write_text(text.replace(old, new), encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          old = '<string name="app_name">ETF財務管家 V3.6.0 NATIVE</string>'
          new = '<string name="app_name">ETF財務管家 V3.6.0 驗證版</string>'
          assert text.count(old) == 1, f'unexpected app_name count: {text.count(old)}'
          strings.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -F "applicationId 'com.etfpilot.twselive.baselineverify'" android/app/build.gradle
          grep -F 'ETF財務管家 V3.6.0 驗證版' android/app/src/main/res/values/strings.xml
          git diff -- android/app/build.gradle android/app/src/main/res/values/strings.xml

      - name: Raise Gradle Metaspace for release build in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          text = p.read_text(encoding='utf-8')
          old = 'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m'
          new = 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m'
          assert text.count(old) == 1, f'unexpected gradle jvmargs count: {text.count(old)}'
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -F 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m' android/gradle.properties

      - name: Ensure signing keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build standalone ARM64 Release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare verification artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ETF-Finance-Manager-V3.6.0-SIDE-BY-SIDE-VERIFY-ARM64.apk
          sha256sum artifacts/ETF-Finance-Manager-V3.6.0-SIDE-BY-SIDE-VERIFY-ARM64.apk | tee artifacts/SHA256.txt
          {
            echo 'baseline_commit=b907d7aeced266e914c360c2f70b475dd9e42b62'
            echo 'source_changes_before_build=none'
            echo 'runner_only_identity_patch=applicationId+app_name'
            echo 'runner_only_gradle_memory_patch=-Xmx3072m,MaxMetaspaceSize=1024m'
            echo 'installed_package=com.etfpilot.twselive.baselineverify'
            echo 'display_name=ETF財務管家 V3.6.0 驗證版'
            echo 'versionName=3.6.0'
            echo 'versionCode=37'
            echo 'buildType=release'
            echo 'architecture=arm64-v8a'
            echo 'js_bundle=embedded'
            echo 'purpose=side-by-side installation without touching existing com.etfpilot.twselive data'
          } | tee artifacts/BUILD_INFO.txt

      - name: Upload side-by-side verification APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.6.0-SIDE-BY-SIDE-VERIFY-ARM64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
