name: Build Side-by-Side Baseline Verification APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'android/app/build.gradle'
      - 'android/app/src/main/res/values/strings.xml'

permissions:
  contents: read

env:
  NODE_ENV: production
  CI: 'true'

jobs:
  build-apk:
    name: Build standalone side-by-side V3.6.0 verification APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify only Android identity differs from frozen baseline
        shell: bash
        run: |
          git cat-file -e b907d7aeced266e914c360c2f70b475dd9e42b62^{commit}
          changed="$(git diff --name-only b907d7aeced266e914c360c2f70b475dd9e42b62 HEAD -- . ':(exclude).github/**')"
          printf '%s\n' "$changed"
          expected=$'android/app/build.gradle\nandroid/app/src/main/res/values/strings.xml'
          test "$changed" = "$expected"
          grep -F "applicationId 'com.etfpilot.twselive.baselineverify'" android/app/build.gradle
          grep -F 'ETF財務管家 V3.6.0 驗證版' android/app/src/main/res/values/strings.xml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run V3.6.0 acceptance preflight
        run: npm run preflight:acceptance

      - name: Ensure signing keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build standalone Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare verification artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ETF-Finance-Manager-V3.6.0-SIDE-BY-SIDE-VERIFY.apk
          sha256sum artifacts/ETF-Finance-Manager-V3.6.0-SIDE-BY-SIDE-VERIFY.apk | tee artifacts/SHA256.txt
          {
            echo 'baseline_commit=b907d7aeced266e914c360c2f70b475dd9e42b62'
            printf 'verification_commit='
            git rev-parse HEAD
            echo 'installed_package=com.etfpilot.twselive.baselineverify'
            echo 'display_name=ETF財務管家 V3.6.0 驗證版'
            echo 'versionName=3.6.0'
            echo 'versionCode=37'
            echo 'buildType=release'
            echo 'purpose=side-by-side installation without touching existing com.etfpilot.twselive data'
          } | tee artifacts/BUILD_INFO.txt

      - name: Upload side-by-side verification APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.6.0-SIDE-BY-SIDE-VERIFY
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
