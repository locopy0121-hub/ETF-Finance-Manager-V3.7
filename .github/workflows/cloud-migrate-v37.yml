name: Cloud Migrate V3.6.0 to V3.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-migrate-v37.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/MIGRATION_TRIGGER.md'

permissions:
  contents: write

jobs:
  migrate:
    name: Import complete V3.6.0 build baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout V3.7 target main
        uses: actions/checkout@v5
        with:
          ref: main
          path: target
          fetch-depth: 0

      - name: Checkout validated V3.6.0 source with Android native baseline
        uses: actions/checkout@v5
        with:
          repository: locopy0121-hub/ETF-Finance-Manager
          ref: 81188981139aad9cecef1c9e135af17a5a4fd997
          token: ${{ secrets.V37_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Remove V4-only architecture document
        shell: bash
        run: |
          rm -f source/docs/superpowers/specs/2026-09-12-v4-architecture-design.md

      - name: Verify required V3.6.0 build sources
        shell: bash
        run: |
          set -euo pipefail
          test -f source/package.json
          test -f source/package-lock.json
          test -f source/app.json
          test -f source/eas.json
          test -f source/App.tsx
          test -d source/src
          test -d source/modules
          test -d source/plugins
          test -d source/scripts
          test -d source/assets
          test -d source/android
          test -f source/android/gradlew
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/AndroidManifest.xml
          test -f source/src/ui/UniversalEditor.tsx
          test -f source/src/ui/editorSchema.ts
          test -f source/src/v3/engine.ts
          test -f source/src/v3/formulaEngine.ts
          test -f source/src/widgets/ProfitWidget.tsx
          test -f source/modules/floating-investment-bot/android/src/main/java/com/etfpilot/floatingbot/FloatingInvestmentBotService.kt
          if test -f source/docs/superpowers/specs/2026-09-12-v4-architecture-design.md; then
            echo 'V4 architecture document still present' >&2
            exit 1
          fi
          echo 'V3.6.0 build-source verification PASS'

      - name: Replace target with V3.6.0 build baseline
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            source/ target/

      - name: Commit cloud migration
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          # Preserve the validated V3.6.0 source byte-for-byte as tracked.
          # Existing whitespace is part of the frozen baseline and is not normalized here.
          git commit -m 'chore: import complete V3.6.0 build baseline for V3.7'
          IMPORT_SHA=$(git rev-parse HEAD)
          git tag -f -a v3.6.0-final-baseline "$IMPORT_SHA" -m 'Complete V3.6.0 source and Android native baseline imported for V3.7'
          git push origin HEAD:main
          git push origin v3.6.0-final-baseline --force
          echo "Imported baseline commit: $IMPORT_SHA"

      - name: Verify imported tree locally
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test -d android
          test -d src
          test -d assets
          test -d modules
          test -d plugins
          test -d scripts
          test ! -f docs/superpowers/specs/2026-09-12-v4-architecture-design.md
          echo 'Cloud migration verification PASS'
