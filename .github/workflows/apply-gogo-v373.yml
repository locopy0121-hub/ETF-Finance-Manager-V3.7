name: Apply GOGO V3.7.3

on:
  push:
    branches: [v3.7.3-master-fix-20260916]
    paths: ['.gogo-v373-apply-trigger']
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v3.7.3-master-fix-20260916
          fetch-depth: 4
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Apply deterministic production patch
        run: python3 scripts/APPLY_GOGO_V373.py
      - name: Install dependencies
        run: npm ci
      - name: V3.7.3 focused contracts
        run: |
          node scripts/V373_MASTER_ACCEPTANCE.cjs
          node scripts/MONITOR_TEMPLATE_CONTRACT_TEST.cjs
          node scripts/COLOR_PALETTE_CONTRACT_TEST.cjs
      - name: TypeScript
        run: npm run typecheck
      - name: Accounting golden and finance regressions
        run: |
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
          node scripts/ACCOUNTING_GOLDEN_00878.cjs
          node scripts/CASH_LEDGER_CONTRACT_TEST.cjs
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
      - name: Source diff integrity
        run: git diff --check
      - name: Commit verified V3.7.3 production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json android/app/build.gradle android/app/src/main/res/values/strings.xml src scripts
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'fix(v3.7.3): unify finance monitor templates palette and renderer'
            git push origin HEAD:v3.7.3-master-fix-20260916
          fi
