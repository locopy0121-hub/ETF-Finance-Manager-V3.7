name: Breaking Huanan Core V3.7.6

on:
  push:
    branches:
      - v3.7.6-breaking-huanan-core-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Breaking Huanan core contract
        run: node scripts/BREAKING_HUANAN_CORE_TEST.cjs
      - name: Residual old-finance scan
        run: node scripts/SCAN_OLD_FINANCE.cjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Existing finance regressions
        run: |
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
      - name: Diff integrity
        run: git diff --check
