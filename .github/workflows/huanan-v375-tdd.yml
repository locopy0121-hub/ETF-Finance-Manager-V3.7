name: Broker Profile Accounting V3.7.5 TDD

on:
  push:
    branches:
      - v3.7.5-huanan-accounting-20260916
      - v3.7.5-broker-profiles-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Broker profile contract
        run: node scripts/BROKER_PROFILE_V375_TEST.cjs
      - name: Huanan broker accounting regression
        run: node scripts/HUANAN_ACCOUNTING_V375_TEST.cjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Existing finance regressions
        run: |
          node scripts/BROKER_PROFILE_V375_TEST.cjs
          node scripts/HUANAN_ACCOUNTING_V375_TEST.cjs
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
      - name: Diff integrity
        run: git diff --check
