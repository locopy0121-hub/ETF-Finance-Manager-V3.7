name: Huanan Accounting V3.7.5 TDD

on:
  push:
    branches: [v3.7.5-huanan-accounting-20260916]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v3.7.5-huanan-accounting-20260916
          fetch-depth: 1
      - name: Apply V3.7.5 Huanan implementation
        run: python3 scripts/APPLY_HUANAN_V375.py
      - name: Huanan broker accounting regression
        run: node scripts/HUANAN_ACCOUNTING_V375_TEST.cjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Existing finance regressions
        run: |
          node scripts/HUANAN_ACCOUNTING_V375_TEST.cjs
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified V3.7.5 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx app.json src/data/tradeSettings.ts src/v3/engine.ts src/v3/model.ts src/v3/screens.tsx src/v3/storage.ts src/v3/version.ts
          git commit -m 'feat(v3.7.5): Huanan broker formulas and cost write-off [skip ci]'
          git push origin HEAD:v3.7.5-huanan-accounting-20260916
