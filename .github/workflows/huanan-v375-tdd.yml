name: Breaking Huanan Core V3.7.6

on:
  push:
    branches:
      - v3.7.6-breaking-huanan-core-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Apply breaking refactor transform
        run: node scripts/APPLY_BREAKING_HUANAN_REFACTOR.cjs
      - name: Breaking Huanan core contract
        run: node scripts/BREAKING_HUANAN_CORE_TEST.cjs
      - name: Residual old-finance scan
        run: node scripts/SCAN_OLD_FINANCE.cjs
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Diff integrity
        run: git diff --check
