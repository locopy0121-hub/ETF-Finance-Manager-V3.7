name: Verify Monitor Refactor V3.7.7
on:
  workflow_dispatch:
  push:
    branches: [gogo-monitor-refactor-20260917]
    paths:
      - 'src/**'
      - 'modules/floating-investment-bot/**'
      - 'scripts/MONITOR_V377_REFACTOR_CONTRACT.cjs'
      - '.github/workflows/verify-monitor-refactor-v377.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gogo-monitor-refactor-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Monitor contracts
        id: monitor_contracts
        shell: bash
        run: |
          set -o pipefail
          node scripts/MONITOR_V377_REFACTOR_CONTRACT.cjs 2>&1 | tee monitor-contract.log
      - name: TypeScript strict check
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-v377-verification-${{ github.run_id }}
          path: |
            monitor-contract.log
            typecheck.log
          if-no-files-found: warn
          retention-days: 7
