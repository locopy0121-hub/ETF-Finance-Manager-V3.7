name: V3.7 Integrated GOGO Repair

on:
  push:
    branches: [v3.7-upgrade-20260915]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  patch-and-verify:
    name: Apply integrated V3.7.1 source fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V3.7 source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Extract integrated patch from release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-android-apk.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=src.find(marker)
          if start < 0:
              raise SystemExit('Integrated patch marker not found in release workflow')
          start += len(marker)
          end=src.find("\n          PY", start)
          if end < 0:
              raise SystemExit('Integrated patch terminator not found in release workflow')
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          out='\n'.join(lines)+'\n'
          Path('/tmp/v371_integrated_patch.py').write_text(out,encoding='utf-8')
          compile(out,'/tmp/v371_integrated_patch.py','exec')
          print('Integrated patch extracted and Python syntax verified.')
          PY

      - name: Apply integrated V3.7.1 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/v371_integrated_patch.py
          git diff --check
          git status --short

      - name: Verify integrated source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-v37-editor-modules.cjs
          grep -F '"version": "3.7.1"' app.json
          grep -F '"versionCode": 39' app.json
          grep -F "APP_SEMVER='3.7.1'" src/v3/version.ts
          git diff -- src/v3/engine.ts src/v3/financeFormat.ts src/data/tradeSettings.ts

      - name: Persist integrated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx app.json src scripts modules
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
          else
            git commit -m 'feat(v3.7.1): live editor preview and synchronized monitor controls'
            git push origin HEAD:v3.7-upgrade-20260915
          fi
