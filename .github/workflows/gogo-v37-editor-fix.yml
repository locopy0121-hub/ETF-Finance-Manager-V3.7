name: V3.7 Targeted Layout Repair

on:
  push:
    branches: [v3.7-upgrade-20260915]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  patch-and-verify:
    name: Patch and verify targeted V3.7 layout fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V3.7 source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Apply only the confirmed layout and PnL fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_once(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  print(f'ALREADY FIXED: {path}')
                  return
              if old not in text:
                  raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:160]}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')
              print(f'PATCHED: {path}')

          # Width rule: choosing a ratio switches back to ratio mode instead of retaining a stale pixel width.
          patch_once(
              'src/v3/GlobalCardDesigner.tsx',
              "onPress={()=>setLocal({...local,span:v})}",
              "onPress={()=>setLocal({...local,span:v,customWidth:undefined})}",
          )

          # Width rule: FlowItem owns span/customWidth; the nested visual block fills that already-sized cell.
          patch_once(
              'src/v3/screens.tsx',
              "colored={PROFIT_LOSS_FIELDS.has(k)}/></FlowItem>",
              "colored={PROFIT_LOSS_FIELDS.has(k)} widthOverride=\"100%\"/></FlowItem>",
          )

          # Portfolio summary: amount and percentage are independent cells, never concatenated.
          patch_once(
              'src/v3/screens.tsx',
              "<Metric label=\"今日損益\" value={common.prefs.privacyMode?'••••':`${money(portfolioSummary.todayPnl)} · ${pct(portfolioSummary.todayPnlPct)}`}/><Metric label=\"總損益\" value={common.prefs.privacyMode?'••••':`${money(portfolioSummary.totalPnl)} · ${pct(portfolioSummary.totalRoi)}`}/>",
              "<Metric label=\"今日損益\" value={common.prefs.privacyMode?'••••':money(portfolioSummary.todayPnl)}/><Metric label=\"今日損益率\" value={common.prefs.privacyMode?'••••':pct(portfolioSummary.todayPnlPct)}/><Metric label=\"總損益\" value={common.prefs.privacyMode?'••••':money(portfolioSummary.totalPnl)}/><Metric label=\"總報酬率\" value={common.prefs.privacyMode?'••••':pct(portfolioSummary.totalRoi)}/>",
          )
          PY

      - name: Targeted regression audit
        run: node scripts/check-v37-editor-modules.cjs

      - name: Source diff integrity
        run: git diff --check

      - name: Persist targeted source fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v3/GlobalCardDesigner.tsx src/v3/screens.tsx
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
          else
            git commit -m 'fix(v3.7): correct nested field widths and split PnL rates'
            git push origin HEAD:v3.7-upgrade-20260915
          fi
