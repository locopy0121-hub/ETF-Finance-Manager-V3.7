              '<Text style={styles.innerLabel} numberOfLines={2}>{labels[key]??key}</Text><Text style={{color:\'#FFFFFF\',fontSize:13,fontWeight:\'900\',marginTop:5}} numberOfLines={2}>{previewValues?.[key]??\'—\'}</Text><Text style={styles.innerMeta}>')
          replace_once('src/v3/GlobalCardDesigner.tsx',
              '<FieldConfigModal visible={!!editingKey} label={editingKey?labels[editingKey]??editingKey:\'\'} config={editingKey?configs[editingKey]??defaultField():null}',
              '<FieldConfigModal visible={!!editingKey} label={editingKey?labels[editingKey]??editingKey:\'\'} previewValue={editingKey?previewValues?.[editingKey]:undefined} config={editingKey?configs[editingKey]??defaultField():null}')
          replace_once('src/v3/GlobalCardDesigner.tsx',
              "export function GlobalCardDesigner({visible,layouts,choicesByPage,onSave,onClose,entryTarget,directMode=false,presets=[],onPresetsChange}:{visible:boolean;layouts:V3PageLayouts;choicesByPage:Record<PageFieldKey,DesignerChoice[]>;onSave:(layouts:V3PageLayouts)=>void;onClose:()=>void;entryTarget?:{page:PageFieldKey;cardId:string};directMode?:boolean;presets?:V3EditorPreset[];onPresetsChange?:(presets:V3EditorPreset[])=>void}){",
              "export function GlobalCardDesigner({visible,layouts,choicesByPage,previewValuesByPage,onSave,onClose,entryTarget,directMode=false,presets=[],onPresetsChange}:{visible:boolean;layouts:V3PageLayouts;choicesByPage:Record<PageFieldKey,DesignerChoice[]>;previewValuesByPage?:Partial<Record<PageFieldKey,Record<string,string>>>;onSave:(layouts:V3PageLayouts)=>void;onClose:()=>void;entryTarget?:{page:PageFieldKey;cardId:string};directMode?:boolean;presets?:V3EditorPreset[];onPresetsChange?:(presets:V3EditorPreset[])=>void}){")
