name: V3.7 Release APK

on:
  push:
    branches: [v3.7-upgrade-20260915]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  verify-and-build:
    name: Verify integrated V3.7.1 fixes and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout V3.7 source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Apply V3.7.1 integrated GOGO fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if new in text:
                  print('ALREADY:', path, new[:70])
                  return
              if old not in text:
                  raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:180]}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')
              print('PATCHED:', path)

          def insert_before(path, marker, block):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if block.strip() in text:
                  print('ALREADY BLOCK:', path); return
              if marker not in text: raise SystemExit(f'INSERT MARKER NOT FOUND: {path}: {marker[:120]}')
              p.write_text(text.replace(marker,block+'\n'+marker,1),encoding='utf-8')
              print('INSERTED:', path)

          # 1) Monitor data model: each displayed function/data item can be pinned.
          replace_once('src/v3/monitoring.ts',
              "export type MonitorFieldStyle={visible:boolean;order:number;fontScale:number;",
              "export type MonitorFieldStyle={visible:boolean;order:number;fixed:boolean;fontScale:number;")

          # 2) Monitor field editor: pin option + real-data preview value.
          replace_once('src/v3/MonitorFieldEditor.tsx',
              "const base=(order=1):MonitorFieldStyle=>({visible:true,order,fontScale:100,",
              "const base=(order=1):MonitorFieldStyle=>({visible:true,order,fixed:false,fontScale:100,")
          replace_once('src/v3/MonitorFieldEditor.tsx',
              "export default function MonitorFieldEditor({visible,field,style,orderMax,positive,negative,onSave,onClose}:{visible:boolean;field:MonitorField|null;style?:MonitorFieldStyle;orderMax:number;positive:string;negative:string;onSave:(v:MonitorFieldStyle)=>void;onClose:()=>void}){",
              "export default function MonitorFieldEditor({visible,field,style,orderMax,positive,negative,sampleValue,onSave,onClose}:{visible:boolean;field:MonitorField|null;style?:MonitorFieldStyle;orderMax:number;positive:string;negative:string;sampleValue?:string;onSave:(v:MonitorFieldStyle)=>void;onClose:()=>void}){")
          replace_once('src/v3/MonitorFieldEditor.tsx',
              " <View style={s.setting}><Text style={s.label}>顯示順序</Text><Step value={d.order} min={1} max={Math.max(1,orderMax)} step={1} onChange={v=>patch({order:v})}/></View>",
              " <View style={s.setting}><Text style={s.label}>顯示順序</Text><Step value={d.order} min={1} max={Math.max(1,orderMax)} step={1} onChange={v=>patch({order:v})}/></View>\n <View style={s.setting}><Text style={s.label}>固定此功能項目 📌</Text><Switch value={d.fixed===true} onValueChange={v=>patch({fixed:v})}/></View>")
          replace_once('src/v3/MonitorFieldEditor.tsx',
              "{field==='symbol'?'00919':pnl?'+186':'32.48'}",
              "{sampleValue??(field==='symbol'?'—':'資料不足')}")
          replace_once('src/v3/MonitorFieldEditor.tsx',
              "{LABELS[field]} · 預覽不會直接寫入桌面監視器",
              "{LABELS[field]} · 使用目前 App 真實資料 · 儲存後才正式套用")

