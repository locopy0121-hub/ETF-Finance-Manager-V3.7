              "import {KeyboardAwareScrollView,KeyboardSafeFooter} from './KeyboardAware';\nimport ColorPalettePicker from '../components/ColorPalettePicker';")
          replace_once('src/ui/UniversalEditor.tsx',
              '<TextInput style={s.input} value={effect.color??\'\'} placeholder="效果顏色 #RRGGBB（可留空）" placeholderTextColor="#64748B" onChangeText={color=>onChange({...effect,color})}/>',
