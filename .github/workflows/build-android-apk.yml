          old_appearance='''<Choices label="文字顏色模式" value={text.colorMode} items={[[\'fixed\',\'固定色\'],[\'theme\',\'跟隨主題\'],[\'profitLoss\',\'跟隨損益色\'],[\'auto\',\'自動\']]} onChange={colorMode=>patchText({colorMode})}/><TextInput style={s.input} value={text.color??\'\'} placeholder="固定文字色 #RRGGBB" placeholderTextColor="#64748B" onChangeText={color=>patchText({color})}/><Choices label="背景顏色模式" value={d.backgroundColorMode??\'theme\'} items={[[\'fixed\',\'固定色\'],[\'theme\',\'跟隨主題\'],[\'profitLoss\',\'跟隨損益色\'],[\'auto\',\'自動\']]} onChange={backgroundColorMode=>patch({backgroundColorMode})}/><TextInput style={s.input} value={d.backgroundColor??\'\'} placeholder="固定背景色 #RRGGBB" placeholderTextColor="#64748B" onChangeText={backgroundColor=>patch({backgroundColor})}/><Choices label="邊框顏色模式" value={d.borderColorMode??\'theme\'} items={[[\'fixed\',\'固定色\'],[\'theme\',\'跟隨主題\'],[\'profitLoss\',\'跟隨損益色\'],[\'auto\',\'自動\']]} onChange={borderColorMode=>patch({borderColorMode})}/><TextInput style={s.input} value={d.borderColor??\'\'} placeholder="固定邊框色 #RRGGBB" placeholderTextColor="#64748B" onChangeText={borderColor=>patch({borderColor})}/>'''
          new_appearance='''<Choices label="文字顏色模式" value={text.colorMode} items={[[\'fixed\',\'固定色\'],[\'theme\',\'跟隨主題\'],[\'profitLoss\',\'跟隨損益色\'],[\'auto\',\'自動\']]} onChange={colorMode=>patchText({colorMode})}/>{text.colorMode===\'fixed\'||text.colorMode===\'auto\'?<ColorPalettePicker label="文字顏色" value={text.color} allowTheme={false} onChange={color=>patchText({color})}/>:null}<Choices label="背景顏色模式" value={d.backgroundColorMode??\'theme\'} items={[[\'fixed\',\'固定色\'],[\'theme\',\'跟隨主題\'],[\'profitLoss\',\'跟隨損益色\'],[\'auto\',\'自動\']]} onChange={backgroundColorMode=>patch({backgroundColorMode})}/>{d.backgroundColorMode===\'fixed\'||d.backgroundColorMode===\'auto\'?<ColorPalettePicker label="背景顏色" value={d.backgroundColor} allowTheme={false} onChange={backgroundColor=>patch({backgroundColor})}/>:null}<Choices label="邊框顏色模式" value={d.borderColorMode??\'theme\'} items={[[\'fixed\',\'固定色\'],[\'theme\',\'跟隨主題\'],[\'profitLoss\',\'跟隨損益色\'],[\'auto\',\'自動\']]} onChange={borderColorMode=>patch({borderColorMode})}/>{d.borderColorMode===\'fixed\'||d.borderColorMode===\'auto\'?<ColorPalettePicker label="邊框顏色" value={d.borderColor} allowTheme={false} onChange={borderColor=>patch({borderColor})}/>:null}'''
          replace_once('src/ui/UniversalEditor.tsx',old_appearance,new_appearance)
          preview_component='''function FloatingEditorPreview({node}:{node:UniversalEditorNode}){const origin=useRef({x:0,y:0});const pos=useRef(new Animated.ValueXY({x:0,y:0})).current;const pan=useMemo(()=>PanResponder.create({onStartShouldSetPanResponder:()=>true,onMoveShouldSetPanResponder:(_e,g)=>Math.abs(g.dx)>2||Math.abs(g.dy)>2,onPanResponderMove:(_e,g)=>pos.setValue({x:origin.current.x+g.dx,y:origin.current.y+g.dy}),onPanResponderRelease:(_e,g)=>{origin.current={x:origin.current.x+g.dx,y:origin.current.y+g.dy};pos.setValue(origin.current)},onPanResponderTerminate:()=>pos.setValue(origin.current)}),[pos]);const t=node.text!;const shown=t.visible?displayNameOf(node):'（目前設定為隱藏）';const color=(t.colorMode==='fixed'||t.colorMode==='auto')&&t.color?t.color:'#F3D675';const background=(node.backgroundColorMode==='fixed'||node.backgroundColorMode==='auto')&&node.backgroundColor?node.backgroundColor:'#101827';const border=(node.borderColorMode==='fixed'||node.borderColorMode==='auto')&&node.borderColor?node.borderColor:'#475569';return <Animated.View {...pan.panHandlers} style={[s.livePreview,{backgroundColor:background,borderColor:border,transform:pos.getTranslateTransform()}]}><Text style={s.livePreviewHead}>☰ 即時資料預覽｜可自由移動</Text><Text style={{fontSize:t.fontSize,fontWeight:t.fontWeight,color,textAlign:t.align,letterSpacing:t.letterSpacing,lineHeight:t.lineHeight,opacity:t.visible?t.opacity:.45}}>{shown}</Text><Text style={s.livePreviewMeta}>{node.kind} · 目前資料：{node.systemName}</Text></Animated.View>}'''
          insert_before('src/ui/UniversalEditor.tsx','export function UniversalEditor',preview_component)
          old_static='''<View style={[s.preview,{backgroundColor:d.backgroundColor||'#101827'}]}><Text style={{fontSize:text.fontSize,fontWeight:text.fontWeight,color:text.color||'#F3D675',textAlign:text.align,letterSpacing:text.letterSpacing,lineHeight:text.lineHeight,opacity:text.opacity}}>{displayNameOf(d)}</Text></View>'''
          replace_once('src/ui/UniversalEditor.tsx',old_static,'<Text style={s.hint}>浮動即時預覽使用目前正在編輯物件的真實文字 / 數值；拖曳只移動預覽窗，不會改變正式版面位置。</Text>')
          replace_once('src/ui/UniversalEditor.tsx',
