          replace_once('src/v3/GlobalCardDesigner.tsx','>+1,234</Text></View></ScrollView>','>{previewValue??\'—\'}</Text></Animated.View></ScrollView>')
          replace_once('src/v3/GlobalCardDesigner.tsx',
