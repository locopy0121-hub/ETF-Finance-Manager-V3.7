name: V3.7 Release APK

on:
  push:
    branches: [v3.7-upgrade-20260915]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'
  EXPECTED_PACKAGE: 'com.etfpilot.twselive'
  EXPECTED_VERSION_NAME: '3.7.5'
  EXPECTED_VERSION_CODE: '43'
  EXPECTED_SIGNING_CERT_SHA256: 'efee34e265df25cb2faa0c20473bccd7e28c34a8a359a9263f4b8006a4f96f06'

jobs:
  verify-and-build:
    name: Verify V3.7.5 and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout V3.7.5 source
        uses: actions/checkout@v5
        with:
          fetch-depth: 4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication and linked EAS project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami --non-interactive
          npx --yes eas-cli@latest project:info

      - name: V3.7.5 downgrade guard
        run: node scripts/V375_VERSION_CHAIN_GUARD.cjs

      - name: Verify V3.7.5 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F "APP_SEMVER='${EXPECTED_VERSION_NAME}'" src/v3/version.ts
          grep -F "OTA_RUNTIME_VERSION='${EXPECTED_VERSION_NAME}'" src/v3/version.ts
          grep -F "\"version\": \"${EXPECTED_VERSION_NAME}\"" app.json
          grep -F "\"runtimeVersion\": \"${EXPECTED_VERSION_NAME}\"" app.json
          grep -F "\"versionCode\": ${EXPECTED_VERSION_CODE}" app.json
          grep -F "versionCode ${EXPECTED_VERSION_CODE}" android/app/build.gradle
          grep -F "versionName \"${EXPECTED_VERSION_NAME}\"" android/app/build.gradle
          grep -F "applicationId '${EXPECTED_PACKAGE}'" android/app/build.gradle

      - name: Apply broker-style open-position PnL formula
        run: python3 scripts/GOGO_V372_BROKER_PNL_FIX.py

      - name: V3.7 acceptance audit
        run: node scripts/V370_UPGRADE_AUDIT.cjs

      - name: Editor and module registry audit
        run: node scripts/check-v37-editor-modules.cjs

      - name: Nested flow parent-width regression
        run: node scripts/FLOW_LAYOUT_PARENT_WIDTH_TEST.cjs

      - name: TypeScript
        run: npm run typecheck

      - name: Accounting contracts
        run: |
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
          node scripts/ACCOUNTING_GOLDEN_00878.cjs
          node scripts/CASH_LEDGER_CONTRACT_TEST.cjs

      - name: Finance and regression checks
        run: |
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
          node scripts/V360_DEVICE_ACCEPTANCE_AUDIT.cjs

      - name: Source diff integrity
        run: git diff --check

      - name: Persist verified broker-style PnL source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/v3/engine.ts \
            App.tsx \
            src/widgets/ProfitWidget.tsx \
            src/widgets/widgetTaskHandler.tsx \
            src/services/backgroundQuoteTask.tsx \
            src/services/backgroundCloseTask.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(v3.7.5): preserve broker-style open-position PnL [skip ci]'
            git push origin HEAD:v3.7-upgrade-20260915
          fi

      - name: Prepare runner-only Android build limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m',
              'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m',
              1,
          )
          lines = []
          found_arch = False
          for line in text.splitlines():
              if line.startswith('reactNativeArchitectures='):
                  lines.append('reactNativeArchitectures=arm64-v8a')
                  found_arch = True
              else:
                  lines.append(line)
          if not found_arch:
              lines.append('reactNativeArchitectures=arm64-v8a')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -F 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m' android/gradle.properties
          grep -F 'reactNativeArchitectures=arm64-v8a' android/gradle.properties

      - name: Build V3.7.5 APK locally with EAS-managed signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "$PWD/artifacts/ETF-Finance-Manager-V3.7.5-GOGO-Finance-EAS-Signed-ARM64.apk"

      - name: Verify signed V3.7.5 APK and package metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT='artifacts/ETF-Finance-Manager-V3.7.5-GOGO-Finance-EAS-Signed-ARM64.apk'
          test -s "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee artifacts/SIGNING_CERT.txt
          "$AAPT" dump badging "$OUT" | grep -E "^package:|^application-label:" | tee artifacts/APK_BADGING.txt
          grep -F "name='${EXPECTED_PACKAGE}'" artifacts/APK_BADGING.txt
          grep -F "versionName='${EXPECTED_VERSION_NAME}'" artifacts/APK_BADGING.txt
          grep -F "versionCode='${EXPECTED_VERSION_CODE}'" artifacts/APK_BADGING.txt
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifacts/SIGNING_CERT.txt | tr '[:upper:]' '[:lower:]' | head -1)"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_SIGNING_CERT_SHA256"
          printf 'expected_signing_cert_sha256=%s\nactual_signing_cert_sha256=%s\n' "$EXPECTED_SIGNING_CERT_SHA256" "$ACTUAL_CERT_SHA256" | tee artifacts/SIGNING_GUARD.txt
          sha256sum "$OUT" | tee artifacts/SHA256.txt
          stat -c 'apk_size_bytes=%s' "$OUT" | tee artifacts/BUILD_INFO.txt
          {
            echo 'source_commit='$(git rev-parse HEAD)
            echo "package=${EXPECTED_PACKAGE}"
            echo "versionName=${EXPECTED_VERSION_NAME}"
            echo "versionCode=${EXPECTED_VERSION_CODE}"
            echo 'scope=broker-style open-position PnL preserved; version-chain repair only'
            echo 'accounting_contracts=passed_before_build'
            echo 'build_executor=GitHub Actions local EAS build'
            echo 'credentials_source=EAS remote managed credentials'
            echo 'credentials_frozen=true'
            echo 'architecture=arm64-v8a'
          } >> artifacts/BUILD_INFO.txt
          unzip -l "$OUT" | grep -E 'assets/index.android.bundle|index.android.bundle'

      - name: Upload V3.7.5 signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.7.5-GOGO-Finance-EAS-Signed-ARM64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
