              "import React,{useEffect,useMemo,useRef,useState} from 'react';")
          replace_once('src/ui/UniversalEditor.tsx',
              "import {Modal,Pressable,StyleSheet,Switch,Text,TextInput,View} from 'react-native';",
              "import {Animated,Modal,PanResponder,Pressable,StyleSheet,Switch,Text,TextInput,View} from 'react-native';")
          replace_once('src/ui/UniversalEditor.tsx',
