name: V3.7.4 Release APK

on:
  push:
    branches: [v3.7.4-release-20260916]
    paths: ['.gogo-v374-build-trigger']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  verify-and-build:
    name: Verify V3.7.4 and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout V3.7.4 release source
        uses: actions/checkout@v5
        with:
          ref: v3.7.4-release-20260916
          fetch-depth: 4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication and linked EAS project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami --non-interactive
          npx --yes eas-cli@latest project:info

      - name: Verify V3.7.4 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F "APP_SEMVER='3.7.4'" src/v3/version.ts
          grep -F 'APP_BUILD=42' src/v3/version.ts
          grep -F '"version": "3.7.4"' app.json
          grep -F '"runtimeVersion": "3.7.4"' app.json
          grep -F '"versionCode": 42' app.json
          grep -F 'versionCode 42' android/app/build.gradle
          grep -F 'versionName "3.7.4"' android/app/build.gradle
          grep -F '<string name="app_name">ETF財務管家 V3.7.4 NATIVE</string>' android/app/src/main/res/values/strings.xml
          grep -F '<string name="expo_runtime_version">3.7.4</string>' android/app/src/main/res/values/strings.xml

      - name: V3.7.4 master integration acceptance
        run: |
          node scripts/V374_MASTER_ACCEPTANCE.cjs
          node scripts/UNIVERSAL_EDITOR_ROUTE_CONTRACT.cjs
          node scripts/MONITOR_TEMPLATE_CONTRACT_TEST.cjs
          node scripts/COLOR_PALETTE_CONTRACT_TEST.cjs
          node scripts/V374_UPGRADE_AUDIT.cjs

      - name: Editor and module registry audit
        run: node scripts/check-v37-editor-modules.cjs

      - name: Nested flow parent-width regression
        run: node scripts/FLOW_LAYOUT_PARENT_WIDTH_TEST.cjs

      - name: TypeScript
        run: npm run typecheck

      - name: Accounting contracts
        run: |
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
          node scripts/ACCOUNTING_GOLDEN_00878.cjs
          node scripts/CASH_LEDGER_CONTRACT_TEST.cjs

      - name: Finance and regression checks
        run: |
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
          node scripts/V360_DEVICE_ACCEPTANCE_AUDIT.cjs

      - name: Source diff integrity
        run: git diff --check

      - name: Prepare runner-only Android build limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m',
              'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m',
              1,
          )
          lines = []
          found_arch = False
          for line in text.splitlines():
              if line.startswith('reactNativeArchitectures='):
                  lines.append('reactNativeArchitectures=arm64-v8a')
                  found_arch = True
              else:
                  lines.append(line)
          if not found_arch:
              lines.append('reactNativeArchitectures=arm64-v8a')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -F 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m' android/gradle.properties
          grep -F 'reactNativeArchitectures=arm64-v8a' android/gradle.properties

      - name: Build V3.7.4 APK locally with EAS-managed signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "$PWD/artifacts/ETF-Finance-Manager-V3.7.4-UNIVERSAL-EDITOR-ROUTE-EAS-Signed-ARM64.apk"

      - name: Verify signed V3.7.4 APK and package metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT='artifacts/ETF-Finance-Manager-V3.7.4-UNIVERSAL-EDITOR-ROUTE-EAS-Signed-ARM64.apk'
          test -s "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee artifacts/SIGNING_CERT.txt
          "$AAPT" dump badging "$OUT" | grep -E "^package:|^application-label:" | tee artifacts/APK_BADGING.txt
          grep -F "name='com.etfpilot.twselive'" artifacts/APK_BADGING.txt
          grep -F "versionName='3.7.4'" artifacts/APK_BADGING.txt
          grep -F "versionCode='42'" artifacts/APK_BADGING.txt
          sha256sum "$OUT" | tee artifacts/SHA256.txt
          stat -c 'apk_size_bytes=%s' "$OUT" | tee artifacts/BUILD_INFO.txt
          {
            echo 'source_commit='$(git rev-parse HEAD)
            echo 'package=com.etfpilot.twselive'
            echo 'versionName=3.7.4'
            echo 'versionCode=42'
            echo 'scope=V3.7.4 canonical Universal Editor route regression recovery; frame label value share editorNodes; V3.7.3 master regressions revalidated'
            echo 'universal_editor_route_contract=passed_before_build'
            echo 'master_acceptance=passed_before_build'
            echo 'accounting_contracts=passed_before_build'
            echo 'build_executor=GitHub Actions local EAS build'
            echo 'credentials_source=EAS remote managed credentials'
            echo 'credentials_frozen=true'
            echo 'architecture=arm64-v8a'
          } >> artifacts/BUILD_INFO.txt
          unzip -l "$OUT" | grep -E 'assets/index.android.bundle|index.android.bundle'

      - name: Upload V3.7.4 signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.7.4-UNIVERSAL-EDITOR-ROUTE-EAS-Signed-ARM64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
