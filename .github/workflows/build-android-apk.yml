name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build V3.6.0 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo / EAS tooling
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run V3.6.0 acceptance preflight
        run: npm run preflight:acceptance

      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ETF-Finance-Manager-V3.6.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.6.0-APK
          path: artifacts/ETF-Finance-Manager-V3.6.0-debug.apk
          if-no-files-found: error
          retention-days: 14
