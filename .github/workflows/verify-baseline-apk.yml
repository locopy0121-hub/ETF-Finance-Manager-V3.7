name: Verify Baseline Android APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone side-by-side V3.6.0 baseline APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact baseline commit
        uses: actions/checkout@v5
        with:
          ref: b907d7aeced266e914c360c2f70b475dd9e42b62
          fetch-depth: 1

      - name: Verify source commit
        run: |
          test "$(git rev-parse HEAD)" = "b907d7aeced266e914c360c2f70b475dd9e42b62"
          git rev-parse HEAD

      - name: Prepare side-by-side verification identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          lines = gradle.read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if line.strip() == 'release {':
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i+1:i+1] = [
                      indent + '    applicationIdSuffix ".verify"',
                      indent + '    versionNameSuffix "-VERIFY"',
                      indent + '    // Verification-only side-by-side identity; source baseline remains unchanged.'
                  ]
                  break
          else:
              raise SystemExit('release buildType not found')
          gradle.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, count = re.subn(r'<string name="app_name">.*?</string>', '<string name="app_name">ETF財務管家 V3.6.0 VERIFY</string>', s, count=1)
          if count != 1:
              raise SystemExit('app_name string not found')
          strings.write_text(s, encoding='utf-8')
          PY
          grep -n "applicationIdSuffix\|versionNameSuffix" android/app/build.gradle
          grep -n 'name="app_name"' android/app/src/main/res/values/strings.xml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run V3.6.0 acceptance preflight
        run: npm run preflight:acceptance

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build standalone Release APK from tracked native project
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare verification package
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ETF-Finance-Manager-V3.6.0-VERIFY-b907d7a.apk
          sha256sum artifacts/ETF-Finance-Manager-V3.6.0-VERIFY-b907d7a.apk | tee artifacts/SHA256.txt
          {
            echo "repository=locopy0121-hub/ETF-Finance-Manager-V3.7"
            printf "source_commit="
            git rev-parse HEAD
            printf "source_tree="
            git rev-parse HEAD^{tree}
            node -e "const e=require('./app.json').expo; console.log('baseline_app_json_version='+e.version); console.log('baseline_runtime_version='+e.runtimeVersion); console.log('baseline_android_version_code='+e.android.versionCode); console.log('baseline_android_package='+e.android.package);"
            echo "installed_application_id=com.etfpilot.twselive.verify"
            echo "installed_version_name=3.6.0-VERIFY"
            echo "build_type=release"
            echo "purpose=side-by-side device verification"
          } | tee artifacts/BUILD_INFO.txt

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.6.0-VERIFY-b907d7a-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
