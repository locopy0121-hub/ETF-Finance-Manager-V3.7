name: Verify Baseline Android APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build exact V3.6.0 baseline APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact baseline commit
        uses: actions/checkout@v5
        with:
          ref: b907d7aeced266e914c360c2f70b475dd9e42b62
          fetch-depth: 1

      - name: Verify source commit
        run: |
          test "$(git rev-parse HEAD)" = "b907d7aeced266e914c360c2f70b475dd9e42b62"
          git rev-parse HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run V3.6.0 acceptance preflight
        run: npm run preflight:acceptance

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK from tracked native project
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare verification package
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ETF-Finance-Manager-V3.6.0-baseline-b907d7a.apk
          sha256sum artifacts/ETF-Finance-Manager-V3.6.0-baseline-b907d7a.apk | tee artifacts/SHA256.txt
          {
            echo "repository=locopy0121-hub/ETF-Finance-Manager-V3.7"
            printf "source_commit="
            git rev-parse HEAD
            printf "source_tree="
            git rev-parse HEAD^{tree}
            node -e "const e=require('./app.json').expo; console.log('app_json_version='+e.version); console.log('runtime_version='+e.runtimeVersion); console.log('android_version_code='+e.android.versionCode); console.log('android_package='+e.android.package);"
          } | tee artifacts/BUILD_INFO.txt

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V3.6.0-baseline-b907d7a-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
